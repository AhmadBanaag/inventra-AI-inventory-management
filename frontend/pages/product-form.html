<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Form — Inventra</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-body">
      <header class="app-navbar" id="app-navbar"></header>

      <main class="app-main">
        <div class="page-header">
          <div>
            <div class="flex items-center gap-3">
              <a href="/pages/inventory.html" class="btn btn-secondary btn-sm">&larr; Back to Inventory</a>
            </div>
            <h1 class="page-title" id="form-heading" style="margin-top: var(--space-2);">Add New Product</h1>
            <p class="page-description">Fill out the details below to add or update an item in your inventory.</p>
          </div>
        </div>

        <div class="card" style="max-width: 720px;">
          <div class="card-body">
            <form id="product-form" novalidate>
              <input type="hidden" id="product-id">

              <!-- Name -->
              <div class="form-group">
                <label for="product-name" class="form-label">Product Name <span class="required">*</span></label>
                <input type="text" id="product-name" class="form-input" placeholder="Enter product name..." required>
                <span class="form-error" id="name-error">Product name is required.</span>
              </div>

              <!-- SKU & Category Grid -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-4);">
                <div class="form-group">
                  <div class="flex items-center justify-between">
                    <label for="product-sku" class="form-label">SKU / Item Code</label>
                    <button type="button" id="generate-sku-btn" class="btn btn-sm" style="padding: 0; min-height: auto; color: var(--color-primary); background: none; border: none; font-size: var(--font-size-xs); cursor: pointer;">
                      Auto-generate
                    </button>
                  </div>
                  <input type="text" id="product-sku" class="form-input" placeholder="Optional SKU code...">
                </div>

                <div class="form-group">
                  <label for="product-category" class="form-label">Category</label>
                  <input type="text" id="product-category" class="form-input" placeholder="e.g. Hardware, Supplies...">
                </div>
              </div>

              <!-- Quantity, Price, and Threshold Grid -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-4);">
                <div class="form-group">
                  <label for="product-quantity" class="form-label">Quantity in Stock <span class="required">*</span></label>
                  <input type="number" id="product-quantity" class="form-input" min="0" value="0" required>
                  <span class="form-error" id="qty-error">Quantity must be 0 or greater.</span>
                </div>

                <div class="form-group">
                  <label for="product-price" class="form-label">Unit Price ($)</label>
                  <input type="number" id="product-price" class="form-input" min="0" step="0.01" value="0.00">
                </div>

                <div class="form-group">
                  <label for="product-threshold" class="form-label">Low Stock Alert Threshold</label>
                  <input type="number" id="product-threshold" class="form-input" min="1" value="5">
                </div>
              </div>

              <!-- Description -->
              <div class="form-group">
                <label for="product-description" class="form-label">Description / Storage Notes</label>
                <textarea id="product-description" class="form-textarea" placeholder="Optional notes regarding supplier, bin location, or specifications..."></textarea>
              </div>

              <!-- Form Buttons -->
              <div class="flex items-center justify-end gap-3" style="margin-top: var(--space-6); border-top: 1px solid var(--color-border); padding-top: var(--space-4);">
                <a href="/pages/inventory.html" class="btn btn-secondary">Cancel</a>
                <button type="submit" id="save-product-btn" class="btn btn-primary">Save Product</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/services/api.js"></script>
  <script src="/js/components/notifications.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/product-form.js"></script>
</body>
</html>
